<script>
/* Data materi terpisah dari logika aplikasi. Sumber: materi 5 kingdom dan bahan ajar sebelumnya. */
"use strict";
const DATA = {"tps":[["TP1","Menjelaskan tujuan dan dasar klasifikasi organisme.","Mengidentifikasi minimal tiga dasar klasifikasi; menjelaskan manfaat klasifikasi dari kasus sehari-hari."],["TP2","Membedakan prokariotik, eukariotik, uniseluler, dan multiseluler.","Membandingkan dua tipe sel; menggunakan ciri sel untuk mengelompokkan contoh."],["TP3","Mengidentifikasi ciri dan contoh setiap kingdom.","Menentukan lima kingdom dari data ciri; menyebutkan masing-masing dua contoh."],["TP4","Menerapkan kunci ciri untuk mengklasifikasi organisme.","Menyusun alasan klasifikasi; menilai ketepatan bukti dalam situasi nyata."],["TP5","Menganalisis peran organisme dan keterbatasan sistem lima kingdom.","Menganalisis manfaat atau risiko organisme; menjelaskan perbedaan model lama dan tiga domain."]],"gloss":[["Klasifikasi","Mengelompokkan organisme berdasarkan ciri tertentu."],["Taksonomi","Ilmu tentang pengelompokan dan penamaan organisme."],["Kingdom","Kelompok besar dalam sistem klasifikasi."],["Sel","Unit dasar penyusun organisme."],["Prokariotik","Sel tanpa inti yang dibungkus membran."],["Eukariotik","Sel dengan inti bermembran."],["Uniseluler","Tubuh tersusun dari satu sel."],["Multiseluler","Tubuh tersusun dari banyak sel."],["Autotrof","Organisme yang membuat bahan organik sendiri dari zat anorganik."],["Heterotrof","Organisme yang memperoleh bahan organik dari organisme lain atau sisa-sisanya."],["Klorofil","Pigmen hijau yang menyerap cahaya untuk fotosintesis."],["Hifa","Benang penyusun tubuh banyak jamur."],["Spora","Sel reproduksi atau penyebaran pada banyak organisme."],["Domain","Tingkatan klasifikasi di atas kingdom dalam sistem modern."]],"modules":[{"id":"materi1","title":"Mengapa mengelompokkan?","tp":"TP1","color":"#0a8393","keywords":"klasifikasi,taksonomi,persamaan,perbedaan,kriteria","body":"Bayangkan perpustakaan tanpa kategori buku. Kamu akan sulit menemukan bacaan yang dibutuhkan. Hal serupa terjadi ketika ilmuwan mempelajari jutaan jenis organisme. Klasifikasi menyusun makhluk hidup ke dalam kelompok berdasarkan persamaan dan perbedaan ciri. Dasarnya dapat berupa bentuk, struktur sel, jumlah sel, dan cara memperoleh makanan. Klasifikasi membuat identifikasi, komunikasi ilmiah, dan pembandingan lebih mudah. Akan tetapi, satu ciri saja sering menipu. Organisme hijau tidak selalu tumbuhan, dan organisme yang tidak berjalan belum tentu jamur. Karena itulah keputusan ilmiah membutuhkan beberapa bukti sekaligus. Dalam petualangan ini kita mencoba model sederhana lima kingdom sebelum mengenal keterbatasannya.","examples":["Semut dan kupu-kupu sama-sama hewan.","Bakteri yoghurt berbeda dari jamur tempe."],"fact":"Kingdom hanyalah salah satu tingkatan takson; ada kelompok yang lebih khusus, seperti genus dan spesies.","mis":"“Semua yang hidup di tanah masuk kelompok sama.” Habitat bukan satu-satunya dasar klasifikasi.","visual":"Diagram hierarki ciri → kelompok → organisme.","q":"Dua organisme sama-sama hijau. Langkah paling tepat untuk mengelompokkannya?","opts":["Langsung menetapkan Plantae","Memeriksa struktur sel dan cara nutrisi","Memastikan keduanya hidup di tanah","Menentukan dari ukurannya saja"],"correct":1,"why":"Warna tidak cukup; struktur dan nutrisi memberi bukti lebih kuat."},{"id":"materi2","title":"Rahasia di dalam sel","tp":"TP2","color":"#1672b2","keywords":"sel,prokariotik,eukariotik,uniseluler,multiseluler","body":"Sel adalah unit terkecil penyusun makhluk hidup. Ada dua pola struktur sel penting. Sel prokariotik tidak memiliki inti yang dibatasi membran; DNA berada di bagian dalam sel tanpa pembungkus inti. Sel eukariotik memiliki inti yang dibatasi membran. Jumlah sel juga menjadi petunjuk: uniseluler berarti hanya satu sel, sedangkan multiseluler terdiri atas banyak sel. Bakteri adalah contoh prokariotik uniseluler. Amoeba adalah eukariotik uniseluler. Kucing dan pohon adalah eukariotik multiseluler. Ingat: jumlah sel tidak otomatis menentukan ada atau tidaknya membran inti. Gunakan dua pertanyaan terpisah saat menilai organisme, yaitu tipe sel dan jumlah sel.","examples":["Bakteri: prokariotik, satu sel.","Amoeba: eukariotik, satu sel."],"fact":"Eukariotik tidak harus multiseluler; ragi dan Amoeba dapat bersel satu.","mis":"“Semua yang bersel satu adalah bakteri.” Amoeba dan ragi bukan bakteri.","visual":"Perbandingan skema dua sel, posisi DNA dan inti.","q":"Sel Amoeba memiliki inti bermembran dan satu sel. Ciri yang tepat?","opts":["Prokariotik multiseluler","Prokariotik uniseluler","Eukariotik uniseluler","Eukariotik multiseluler"],"correct":2,"why":"Inti bermembran menunjukkan eukariotik; satu sel berarti uniseluler."},{"id":"materi3","title":"Monera: si kecil tanpa inti","tp":"TP3","color":"#3a73bb","keywords":"Monera,bakteri,prokariotik,pembelahan biner,cyanobacteria","body":"Dalam model lima kingdom klasik, Monera mencakup organisme prokariotik yang tidak memiliki membran inti. Anggotanya umumnya bersel satu, berukuran sangat kecil, dan hidup di beragam lingkungan. Sebagian bakteri menguraikan sisa makhluk hidup, sebagian membantu membuat makanan fermentasi, dan sebagian dapat menyebabkan penyakit. Bakteri dapat memperoleh makanan dengan berbagai cara; beberapa membuat senyawa organik sendiri, sedangkan yang lain bergantung pada sumber organik. Banyak bakteri berkembang biak dengan pembelahan biner, yaitu satu sel membelah menjadi dua. Cyanobacteria juga dimasukkan dalam Monera pada model klasik, walaupun mampu berfotosintesis. Dalam ilmu modern, kelompok prokariotik dipisahkan menjadi domain Bacteria dan Archaea.","examples":["Lactobacillus dalam fermentasi yoghurt.","Cyanobacteria di lingkungan perairan."],"fact":"Kemampuan fotosintesis tidak otomatis berarti tumbuhan.","mis":"“Semua bakteri merugikan.” Banyak bakteri berguna bagi ekosistem dan manusia.","visual":"Kartu mikroskop bakteri dan cyanobacteria.","q":"Organisme X tak memiliki inti bermembran tetapi mampu fotosintesis. Dalam model klasik, X mungkin termasuk ...","opts":["Monera","Animalia","Fungi","Plantae"],"correct":0,"why":"Ciri prokariotik adalah bukti kuat bagi Monera model klasik."},{"id":"materi4","title":"Protista: beragam dan unik","tp":"TP3","color":"#6d57ba","keywords":"Protista,Amoeba,Paramecium,Euglena,eukariotik","body":"Protista dalam model lima kingdom adalah kelompok eukariotik yang umumnya sederhana dan sangat beragam. Sebagian besar anggotanya bersel satu, walaupun ada pula bentuk multiseluler sederhana. Banyak hidup di air atau lingkungan lembap. Ada yang memperoleh makanan dari organisme lain, ada yang melakukan fotosintesis, dan ada yang dapat memakai lebih dari satu cara. Amoeba bergerak dengan kaki semu; Paramecium menggunakan rambut getar; Euglena memiliki bulu cambuk. Alga tertentu pun masuk kelompok ini dalam klasifikasi klasik. Protista memperlihatkan mengapa penampilan luar saja tidak cukup: organisme bersel satu yang bisa berfotosintesis belum tentu masuk kingdom Plantae.","examples":["Amoeba di lingkungan air.","Euglena yang dapat berfotosintesis."],"fact":"Dalam sistem modern, Protista bukan satu kelompok kekerabatan evolusioner yang sederhana.","mis":"“Protista pasti mirip hewan.” Sebagian mirip tumbuhan atau memiliki cara hidup lain.","visual":"Tiga kartu bentuk sel dan alat gerak.","q":"Euglena berinti bermembran dan dapat berfotosintesis. Dalam model lima kingdom, kelompoknya?","opts":["Fungi","Monera","Protista","Animalia"],"correct":2,"why":"Euglena dicontohkan sebagai protista eukariotik."},{"id":"materi5","title":"Fungi: sang pengurai","tp":"TP3","color":"#bc7739","keywords":"Fungi,jamur,kitin,hifa,absorpsi","body":"Jamur tidak sama dengan tumbuhan. Fungi adalah organisme eukariotik yang tidak memiliki klorofil, sehingga tidak membuat makanan melalui fotosintesis. Jamur mengambil nutrisi dengan cara menyerap bahan organik dari lingkungan. Dinding selnya terutama mengandung kitin, berbeda dari selulosa pada tumbuhan. Ada jamur bersel satu seperti ragi, serta jamur multiseluler yang umumnya tersusun atas benang-benang hifa. Banyak fungi berkembang biak dengan spora, meskipun caranya beragam. Jamur berperan menguraikan daun dan kayu mati serta dimanfaatkan dalam pangan. Namun, sebagian dapat merusak makanan atau menyebabkan penyakit. Jangan mencicipi jamur liar untuk mencoba mengidentifikasinya.","examples":["Rhizopus dalam pembuatan tempe.","Saccharomyces dalam fermentasi roti."],"fact":"Jamur bisa bersel satu ataupun banyak sel.","mis":"“Jamur adalah tumbuhan tanpa daun.” Jamur berbeda cara nutrisi dan bahan dinding selnya.","visual":"Diagram hifa dan kartu ragi vs jamur payung.","q":"Organisme multiseluler menyerap nutrisi dan berdinding sel kitin. Termasuk ...","opts":["Fungi","Plantae","Animalia","Monera"],"correct":0,"why":"Penyerapan nutrisi dan kitin adalah petunjuk khas fungi."},{"id":"materi6","title":"Plantae: produsen hijau","tp":"TP3","color":"#298052","keywords":"Plantae,kloroplas,selulosa,fotosintesis,multiseluler","body":"Plantae mencakup tumbuhan eukariotik multiseluler. Sel tumbuhan umumnya memiliki dinding sel berbahan utama selulosa serta kloroplas yang memungkinkan fotosintesis. Dalam proses ini, tumbuhan menggunakan energi cahaya untuk menyusun zat organik dari bahan sederhana. Kelompok tumbuhan yang lazim dipelajari adalah lumut, paku, serta tumbuhan berbiji seperti mangga dan padi. Keberadaan tumbuhan sangat penting sebagai produsen dalam rantai makanan dan sebagai penyedia habitat. Walaupun tidak berpindah tempat seperti kebanyakan hewan, tumbuhan tetap menanggapi rangsangan dan tumbuh. Ciri fotosintesis saja tidak cukup menggolongkan organisme sebagai Plantae karena ada protista dan bakteri fotosintetik.","examples":["Lumut di dinding lembap.","Pohon mangga di halaman."],"fact":"Biji tidak dimiliki semua tumbuhan; lumut dan paku bereproduksi dengan spora.","mis":"“Semua yang berfotosintesis adalah Plantae.” Ada cyanobacteria dan alga.","visual":"Diagram kelompok lumut, paku, tumbuhan berbiji.","q":"Paku dan mangga sama-sama masuk Plantae karena ...","opts":["Keduanya menghasilkan biji","Keduanya hewan multiseluler","Keduanya eukariotik multiseluler fotosintetik","Keduanya tidak memiliki dinding sel"],"correct":2,"why":"Paku tidak berbiji, tetapi keduanya merupakan tumbuhan."},{"id":"materi7","title":"Animalia: konsumen aktif","tp":"TP3","color":"#ba567e","keywords":"Animalia,heterotrof,vertebrata,invertebrata,jaringan","body":"Hewan atau Animalia adalah organisme eukariotik multiseluler yang memperoleh bahan organik dengan memakan organisme lain atau materi organik. Berbeda dari tumbuhan dan jamur, sel hewan tidak memiliki dinding sel. Sebagian besar hewan memiliki jaringan dan organ yang menjalankan tugas khusus. Hewan sering bergerak aktif setidaknya pada suatu tahap kehidupannya, tetapi gerak bukan satu-satunya ciri penentu. Kita dapat membedakan hewan vertebrata yang memiliki tulang belakang, seperti kucing dan ikan, dari invertebrata yang tidak memiliki tulang belakang, seperti cacing dan kupu-kupu. Hewan berperan sebagai konsumen, penyerbuk, pemangsa, dan bagian penting dalam jejaring makanan.","examples":["Semut sebagai hewan invertebrata.","Kucing sebagai hewan vertebrata."],"fact":"Tidak semua hewan bergerak bebas sepanjang hidup; beberapa melekat saat dewasa.","mis":"“Hewan selalu lebih besar dari protista.” Ukuran bukan penentu kingdom.","visual":"Percabangan vertebrata dan invertebrata.","q":"Karakter yang paling mendukung Animalia ialah ...","opts":["Prokariotik, satu sel","Multiseluler, tanpa dinding sel, heterotrof","Memiliki dinding kitin dan menyerap makanan","Memiliki kloroplas dan membuat makanan"],"correct":1,"why":"Animalia eukariotik multiseluler tanpa dinding sel dan heterotrof."},{"id":"materi8","title":"Detektif klasifikasi","tp":"TP4, TP5","color":"#0c8891","keywords":"kunci ciri,bukti,peran,model,domain","body":"Saat mengidentifikasi organisme, mulailah dengan tipe sel. Jika prokariotik, model lima kingdom mengarah ke Monera. Jika eukariotik, periksa jumlah sel, cara memperoleh makanan, dan dinding sel. Fungi menyerap nutrisi dan umumnya berdinding kitin. Plantae multiseluler dan umumnya berfotosintesis dengan dinding selulosa. Animalia multiseluler, memakan bahan organik, dan tidak berdinding sel. Protista meliputi beragam eukariot sederhana yang tidak masuk tiga kelompok tersebut dalam model klasik. Selalu catat keterbatasan data. Dalam biologi modern, ilmuwan juga memakai kekerabatan berdasarkan molekul DNA dan sistem tiga domain. Menggunakan model secara tepat berarti tahu kapan model itu berguna dan kapan perlu diperbaiki.","examples":["Ragi: eukariotik satu sel, menyerap nutrisi → Fungi.","Bakteri fermentasi: prokariotik → Monera (klasik)."],"fact":"Tiga domain modern ialah Bacteria, Archaea, dan Eukarya.","mis":"“Lima kingdom satu-satunya sistem benar selamanya.” Model ilmiah terus diperbarui.","visual":"Bagan keputusan berbasis ciri sel.","q":"Apa tindakan paling ilmiah ketika bukti klasifikasi belum cukup?","opts":["Memilih dari warna saja","Mengabaikan data yang tak cocok","Meminta bukti tambahan dan memberi catatan ketidakpastian","Menetapkan kingdom secara acak"],"correct":2,"why":"Identifikasi harus sesuai kekuatan bukti dan boleh ditunda."}],"activities":[{"id":"akt1","title":"Klasifikasikan organisme","kind":"Pilih kategori","tp":"TP3","level":"C3","goal":"Terapkan ciri pada contoh nyata.","data":"Sampel bakteri yoghurt diketahui bersel satu dan tidak memiliki inti bermembran.","options":["Protista","Monera","Fungi","Plantae"],"correct":1,"why":"Ciri prokariotik menempatkan bakteri dalam Monera pada model klasik.","responses":["Protista mempunyai inti bermembran.","Benar! Bakteri adalah prokariotik.","Fungi adalah eukariotik.","Plantae umumnya multiseluler eukariotik."],"visual":"Kartu data laboratorium"},{"id":"akt2","title":"Cocokkan ciri dan kingdom","kind":"Mencocokkan pasangan","tp":"TP3","level":"C3","goal":"Hubungkan ciri dan kelompok.","data":"Pasangan mana yang seluruhnya sesuai?","options":["Fungi—selulosa; Plantae—kit function visual(name,alt,cls=''){return `<img src="${EMBEDDED_IMAGES[name]}" alt="Ilustrasi skematis: ${escapeHtml(alt)}" loading="lazy" decoding="async" class="${cls}">`;}
function specimens(views,extra=''){return `<div class="specimen-gallery ${extra}">${views.map(([key,label],i)=>`<figure class="specimen ${i===0?'featured':''}">${visual(key,label)}<figcaption><span class="specimen-index">VISUAL ${String(i+1).padStart(2,'0')}</span> ${escapeHtml(label)}</figcaption></figure>`).join('')}</div>`;}
function levelFigure(i){return `<div class="level-visual"><div class="lab-label">GALERI SPESIMEN · ${i+1}/8</div>${specimens(SCENE_GALLERY[i])}<p class="diagram-note">Gambar merupakan ilustrasi skematis untuk belajar, bukan foto mikroskop dan tidak menunjukkan skala sebenarnya.</p></div>`;}
function heroArt(){const picks=[['bacteria','MONERA'],['amoeba','PROTISTA'],['mushrooms','FUNGI'],['sunflower','PLANTAE'],['butterfly','ANIMALIA']];return `<div class="realm-stage" aria-label="Galeri ilustrasi lima kingdom"><div class="realm-head"><span class="realm-dot"></span><span>MISSION CONTROL / BIOLOGY</span><span class="realm-small">5 KINGDOM UNIVERSE</span></div><div class="realm-halo" aria-hidden="true"></div><div class="realm-grid">${picks.map((v,i)=>`<div class="realm-card realm-${i}">${visual(v[0],v[1])}<span class="realm-name">${v[1]}</span><span class="realm-num">0${i+1}</span></div>`).join('')}</div><div class="realm-footer"><span>5 DUNIA • 8 LEVEL • 20 SOAL</span><span>✦ DISCOVER LIFE</span></div></div>`;}
function coverPage(){return `<section class="cover"><div><span class="pill">EKSPEDISI SAINS · SMP/MTs KELAS VII</span><h1>5 KERAJAAN <em>MAKHLUK HIDUP</em></h1><p class="cover-lead">Jelajahi dunia mikroba, jamur, tumbuhan, dan hewan melalui 8 level penuh ilustrasi, 4 misi interaktif, serta 20 tantangan kuis. Kumpulkan XP dan jadilah Penjelajah Kingdom!</p><p class="muted"><b>PKBM Al-Khadijah</b><br>Disusun oleh <b>FAUZAN NABI S.Pd</b></p><div class="cover-form cover-start"><div class="eyebrow">PETUALANGAN DIMULAI DI SINI</div><h3>Siap menjelajahi 5 kingdom?</h3><button class="btn navy full" type="button" data-action="start">MULAI PETUALANGAN <span aria-hidden="true">→</span></button><p class="fine-print" style="margin:10px 0 0">Tanpa login atau mengisi data diri. Progres belajar tersimpan di browser ini.</p></div></div>${heroArt()}</section>`;}
function guidePage(){const steps=[['01','Pilih level','Gunakan Menu untuk membuka pos yang sudah aktif.'],['02','Baca materi','Pelajari kartu, diagram, fakta, dan contoh.'],['03','Jawab tantangan','Kerjakan cek pemahaman dan empat aktivitas.'],['04','Raih hadiah','Jawaban benar mendapat XP, poin, dan bintang satu kali.'],['05','Buka level','Cek materi benar membuka pos materi berikutnya.'],['06','Kuis akhir','Selesaikan 20 soal. Nilai tuntas minimal 80.'],['07','Ulang & lanjut','Kesalahan boleh diperbaiki. Kuis dapat diulang.'],['08','Reset','Tombol ↺ menghapus data setelah konfirmasi.']];return `${shellHead('Cara bermain','Petunjuk penjelajah','Ikuti tahapan singkat ini. Semua aktivitas bisa dijalankan dengan mouse, sentuhan, atau keyboard.')}
 <div class="grid3">${steps.map(x=>`<div class="card-sm"><span class="pill secondary">${x[0]}</span><h3 style="margin:12px 0 7px">${x[1]}</h3><p class="muted text-sm">${x[2]}</p></div>`).join('')}</div><div class="tip" style="margin-top:18px"><b>Tips:</b> Gunakan tombol ← dan → untuk navigasi jika kursor tidak sedang berada di kolom jawaban. Jawaban dan progres otomatis disimpan pada perangkat ini.</div><div class="btns"><button class="btn navy" data-action="go" data-page="goals">Lihat Tujuan Pembelajaran →</button><button class="btn secondary" data-action="menu">Kembali ke Menu</button></div>`;}
function goalsPage(){return `${shellHead('Target petualangan','Tujuan pembelajaran','Lima misi belajar yang akan kamu kuasai setelah menyelesaikan permainan.','5 TUJUAN')}
<div class="grid2">${DATA.tps.map(t=>`<article class="card objective-card"><div class="id">${escapeHtml(t[0])}</div><h3 style="margin-top:10px">${escapeHtml(t[1])}</h3><p class="muted text-sm">Indikator: ${escapeHtml(t[2])}</p></article>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Bekal awal & pertanyaan besar</h3><div class="grid2"><div><b>Sudah kenal?</b><p>Sel, organisme, lingkungan, ciri makhluk hidup, dan perbedaan tumbuhan dengan hewan.</p></div><div><b>Coba pikirkan...</b><ol class="text-sm"><li>Mengapa mengklasifikasikan organisme itu penting?</li><li>Bagaimana struktur sel membantu pengelompokan?</li><li>Apa ciri yang membedakan lima kingdom?</li><li>Mengapa warna hijau tidak cukup untuk menentukan kingdom?</li><li>Bagaimana bakteri dan jamur berperan dalam kehidupan sehari-hari?</li><li>Mengapa ilmuwan memperbarui cara klasifikasi?</li></ol></div></div></div><div class="btns"><button class="btn navy" data-action="go" data-page="menu">Saya Siap Belajar →</button><button class="btn secondary" data-action="menu">Kembali ke Menu</button></div>`;}
function statusFor(page){if(completed(page))return ['Selesai',''];if(!canOpen(page))return ['Terkunci','lock'];if(S.visits.includes(page))return ['Sedang Dipelajari','wait'];return ['Belum Dibuka','wait'];}
function menuPage(){const menus=[{id:'aper',icon:'?',title:'Apersepsi',desc:'Misteri dapur dan halaman.'},...DATA.modules.map((m,i)=>({id:'materi'+i,icon:String(i+1).padStart(2,'0'),title:m.title,desc:'Jelajahi konsep · '+m.tp})),{id:'activities',icon:'✣',title:'Aktivitas interaktif',desc:'Empat jenis tantangan yang bisa dicoba ulang.'},{id:'case',icon:'⌕',title:'Studi kasus',desc:'Identifikasi organisme misterius.'},{id:'project',icon:'▤',title:'Proyek',desc:'Bandingkan dua metode klasifikasi.'},{id:'quiz',icon:'20',title:'Kuis akhir',desc:'20 soal, ketuntasan 80.'},{id:'summary',icon:'◉',title:'Rangkuman',desc:'Peta konsep dan kata kunci.'},{id:'reflection',icon:'✎',title:'Refleksi',desc:'Tulis pengalaman belajarmu.'},{id:'results',icon:'★',title:'Hasil belajar',desc:'Lihat nilai, lencana, dan cetak hasil.'}];let done=CORE_STAGES.filter(completed).length;return `<section class="hero-mini"><div class="eyebrow" style="color:#a5e7d8">PETA JELAJAH</div><h2 style="margin:4px 0 10px">Selamat datang, Penjelajah!</h2><p>Pilih kartu untuk melanjutkan ekspedisi. Selesaikan satu pos untuk membuka pos berikutnya.</p><div class="row"><span class="pill yellow">${done}/${CORE_STAGES.length} tahap selesai</span><span class="pill">Target nilai 80</span></div></section><div class="milestone-bar" aria-label="Progres pembelajaran"><span style="width:${(100*done/CORE_STAGES.length).toFixed(1)}%"></span></div><p class="muted text-sm" style="margin:9px 0 23px">Buka level secara berurutan. Progres tersimpan otomatis.</p><div class="menu-grid">${menus.map(m=>{const [status,c]=statusFor(m.id),locked=!canOpen(m.id);return `<article class="menu-tile ${locked?'is-locked':completed(m.id)?'is-done':''}"><div class="tile-thumb">${visual(m.id.startsWith("materi")?LEVEL_SCENES[Number(m.id.slice(6))]:(m.id==="aper"?"ecosystem":m.id==="activities"?"paramecium":m.id==="case"?"bacteria":m.id==="project"?"fern":m.id==="quiz"?"butterfly":"classification"),m.title)}</div><div class="menu-head"><span class="tile-icon" aria-hidden="true">${m.icon}</span><span class="tile-star">★ ${m.id==='activities'?4:['case','project'].includes(m.id)?2:m.id==='quiz'?3:['results','summary'].includes(m.id)?0:1}</span></div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.desc)}</p><span class="menu-status ${c}">${status}</span><button type="button" class="btn ${locked?'secondary':'navy'} small full" data-action="go" data-page="${m.id}" ${locked?'disabled aria-label="Level terkunci"':''}>${locked?'🔒 Terkunci':completed(m.id)?'Lihat Kembali':'Buka Level →'}</button></article>`}).join('')}</div>`;}
function aperPage(){return `${shellHead('Level pembuka','Misteri di dapur','Bacalah cerita singkat, buat prediksi, lalu buka penjelasan.','+5 XP')}
<div class="wide-visual-band">${specimens([["bacteria","Bakteri yoghurt"],["rhizopus","Jamur roti"],["sunflower","Tumbuhan cabai (ilustrasi kelompok)"]],"compact")}</div><div class="grid2"><article class="card"><div class="eyebrow">Skenario</div><h3>Lima temuan saat pagi hari</h3><p>Di rumah kamu melihat yoghurt di kulkas, roti yang mulai berjamur, tanaman cabai di halaman, semut yang mencari makanan, dan genangan air berwarna hijau. Kelimanya memiliki ciri berbeda. Sebagian dapat dilihat jelas, tetapi sebagian lain memerlukan mikroskop. Ada yang membuat makanan sendiri, ada yang menyerap zat organik, dan ada yang memakan organisme lain. Bagaimana kamu menentukan mana yang paling berkerabat? Apakah hanya warna dan tempat hidup cukup? Inilah misteri yang akan kamu pecahkan selama petualangan lima kingdom.</p><div class="flow-diagram" style="margin-top:14px"><span class="flow-node">Yoghurt</span><span class="flow-node">Roti</span><span class="flow-node">Cabai</span><span class="flow-node">Semut</span><span class="flow-node">Kolam</span></div></article><article class="card"><div class="eyebrow">Pertanyaan pemantik</div><ol><li>Mengapa yoghurt berbeda dari tanaman cabai?</li><li>Apakah benda hijau selalu tumbuhan?</li><li>Ciri apa yang sulit dilihat dengan mata?</li></ol><div class="input-group"><label for="aper-prediction">Prediksiku: “Saya memprediksi ... karena ...”</label><textarea id="aper-prediction" data-save="aperPrediction" placeholder="Saya memprediksi ... karena ..." maxlength="1200"></textarea></div><div id="aper-error" class="error-text" aria-live="polite"></div><button class="btn navy" data-action="reveal-aper">Lihat Penjelasan</button></article></div><div id="aper-feedback" class="card" style="margin-top:18px" ${S.aperRevealed?'':'hidden'}><div class="pill">Umpan balik</div><h3 style="margin-top:12px">Prediksimu adalah awal penyelidikan!</h3><p>Kesimpulan belum bisa diambil dari warna atau tempat hidup saja. Ilmuwan memeriksa struktur sel, jumlah sel, cara memperoleh nutrisi, serta hubungan antarciri. Yoghurt melibatkan bakteri; jamur roti termasuk Fungi; cabai Plantae; semut Animalia; air hijau mungkin mengandung organisme dari kelompok berbeda.</p><p class="muted text-sm">Jika prediksimu belum sesuai, tidak masalah. Gunakan informasi baru untuk memperbaiki alasanmu.</p><button class="btn" data-action="go" data-page="materi0">Masuk ke Materi 1 →</button></div>`;}

function shuffledIndices(n){let a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 return `${shellHead('Tantangan akhir','Uji kemampuanmu','Baca soal, pilih satu jawaban, dan pelajari penjelasannya.','SOAL '+(i+1)+' / '+DATA.questions.length)}<article class="card"><div class="quiz-header"><span class="pill secondary">${escapeHtml(item.kind)} · ${escapeHtml(item.tp)} · ${escapeHtml(item.level)}</span><strong>${Object.keys(q.answers).length} dari 20 dijawab</strong></div><div class="quiz-progress" role="progressbar" aria-label="Progres kuis" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${Object.keys(q.answers).length}"><span style="width:${5*Object.keys(q.answers).length}%"></span></div><div class="quiz-visual-strip">${visual({TP1:"classification",TP2:"cell_euk",TP3:"ecosystem",TP4:"domains",TP5:"ecosystem"}[item.tp]||"classification","Petunjuk visual konsep biologi")}</div><p class="quiz-question" style="margin-top:26px">${i+1}. ${escapeHtml(item.q)}</p><div class="options">${order.map((orig,j)=>`<button type="button" class="option-btn ${answered&&orig===choice?(correct?'correct':'incorrect'):''} ${answered&&orig===item.correct?'correct':''}" data-action="quiz-answer" data-index="${orig}" ${answered?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${escapeHtml(item.opts[orig])}</span></button>`).join('')}</div><div aria-live="polite" aria-atomic="true">${answered?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'✓ Benar!': 'Belum tepat.'}</strong><p style="margin:6px 0"><b>Jawaban:</b> ${escapeHtml(item.opts[item.correct])}</p>${escapeHtml(item.why)}</div>`:''}</div><div class="btns">${answered?`<button class="btn navy" data-action="quiz-next">${i===DATA.questions.length-1?'Selesai dan Lihat Hasil':'Soal Berikutnya →'}</button>`:'<span class="hint">Pilih satu jawaban untuk melanjutkan.</span>'}</div></article>`;}
function quizResultPage(){const q=S.quiz,num=q.score/5,wrong=20-num,[label,motivation]=verdict(q.score),elapsed=duration(q.endTime-q.startTime);return `<article class="card print-area" id="quiz-print"><div class="eyebrow">Laporan kuis • PKBM Al-Khadijah</div><h2>Hasil Kuis Akhir</h2><p>Biologi · 5 Kerajaan Makhluk Hidup</p><div class="grid2"><div><p><b>Penyusun:</b> FAUZAN NABI S.Pd</p><div class="grade">${q.score}</div><div class="pill ${q.score>=80?'':'pink'}">${label} · ${q.score>=80?'TUNTAS':'BELUM TUNTAS'}</div><p style="margin-top:12px">${motivation}</p></div><div class="grid2 two-mobile"><div class="metric"><span class="metric-num">${num}</span><span class="metric-label">Jawaban benar</span></div><div class="metric"><span class="metric-num">${wrong}</span><span class="metric-label">Jawaban salah</span></div><div class="metric"><span class="metric-num">${q.score}%</span><span class="metric-label">Nilai</span></div><div class="metric"><span class="metric-num" style="font-size:1.15rem">${elapsed}</span><span class="metric-label">Waktu pengerjaan</span></div></div></div><div class="divider"></div><p class="fine-print">Skor maksimal 100, KKM 80. Jumlah percobaan: ${q.attempts}. Nilai terbaik: ${q.best??q.score}.</p><div class="btns no-print"><button class="btn navy" data-action="start-quiz">Ulangi Kuis ↺</button><button class="btn secondary" data-action="menu">Kembali ke Menu</button><button class="btn outline" data-action="print">Cetak Hasil</button><button class="btn" data-action="go" data-page="summary">Lihat Rangkuman →</button></div></article>`;}
function summaryPage(){let facts=['Klasifikasi membantu identifikasi dan komunikasi ilmiah.','Ciri kunci meliputi tipe sel, jumlah sel, serta cara nutrisi.','Monera (model klasik) adalah organisme prokariotik.','Protista (model klasik) mencakup eukariotik sederhana yang beragam.','Fungi menyerap nutrisi dan dinding selnya terutama berkitin.','Plantae umumnya multiseluler dan melakukan fotosintesis.','Animalia multiseluler dan tidak memiliki dinding sel.','Warna hijau tidak selalu berarti kingdom Plantae.','Keputusan klasifikasi membutuhkan lebih dari satu bukti.','Sistem lima kingdom bersifat historis; biologi modern memakai tiga domain.'];return `${shellHead('Ringkas & kuat','Peta konsep 5 kingdom','Jahit kembali semua informasi yang kamu temukan di petualangan.','REVIEW')}
<div class="wide-visual-band">${specimens([["bacteria","Monera"],["amoeba","Protista"],["mushrooms","Fungi"],["fern","Plantae"],["butterfly","Animalia"]],"summary-gallery")}</div><article class="card"><h3>Peta konsep</h3><div class="concept-map"><span class="flow-node dark">Makhluk Hidup</span><span class="flow-arrow">↓ Struktur sel · organisasi · nutrisi</span><div class="concept-branches">${KINGDOMS.map((k,i)=>`<div><b>${k}</b><span>${['Prokariotik','Eukariot sederhana','Penyerapan nutrisi','Fotosintesis','Konsumsi bahan organik'][i]}</span></div>`).join('')}</div></div></article><div class="grid2" style="margin-top:17px"><article class="card"><h3>10 hal utama</h3><ol>${facts.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol></article><article class="card"><h3>Kartu istilah utama</h3><p class="muted text-sm">Ketuk atau klik untuk menampilkan penjelasan istilah.</p><div class="stack-sm">${DATA.gloss.map(g=>`<details><summary>${escapeHtml(g[0])}</summary><p>${escapeHtml(g[1])}</p></details>`).join('')}</div></article></div><div class="card" style="margin-top:18px"><h3>Diagram hubungan</h3><div class="flow-diagram"><span class="flow-node">Ciri sel</span><span class="flow-arrow">+</span><span class="flow-node">Cara nutrisi</span><span class="flow-arrow">+</span><span class="flow-node">Bukti lain</span><span class="flow-arrow">→</span><span class="flow-node dark">Kesimpulan sementara</span></div><p class="hint" style="margin-top:13px">Keterbatasan: kelompok Monera dan Protista klasik bukan selalu kelompok kekerabatan tunggal menurut kajian evolusi modern.</p></div><div class="btns"><button class="btn navy" data-action="finish-summary">Saya Sudah Mengulas Materi →</button><button class="btn secondary" data-action="menu">Kembali ke Menu</button></div>`;}
function reflectionPage(){const prompts=['Hal baru apa yang saya pelajari?','Konsep apa yang paling saya pahami?','Bagian apa yang masih sulit?','Aktivitas apa yang paling membantu?','Apa yang akan saya pelajari kembali?'];return `${shellHead('Suara penjelajah','Refleksi belajarku','Tidak harus selalu sempurna. Tuliskan pengalaman yang jujur dan rencana belajar berikutnya.','+10 XP')}
<div class="stack">${prompts.map((p,i)=>`<div class="reflection-row"><label for="reflect-${i}">${i+1}. ${p}</label><textarea id="reflect-${i}" data-reflection="${i}" maxlength="1200" placeholder="Tulis pendapatmu di sini..."></textarea></div>`).join('')}</div><p class="fine-print" style="margin-top:14px">Jawaban disimpan pada localStorage browser ini, tidak dikirimkan kepada guru atau server.</p><p class="error-text" id="reflection-error" aria-live="polite"></p><div class="btns"><button class="btn navy" data-action="finish-reflection">Simpan Refleksi & Lihat Hasil →</button><button class="btn secondary" data-action="menu">Menu Utama</button></div>`;}
function badgeList(){const badges=[
 ['Detektif Sel','◈','Tuntaskan Materi 1 dan 2.',completed('materi1')],
 ['Ahli 5 Kingdom','5','Tuntaskan semua delapan pos materi.',completed('materi7')],
 ['Peneliti Lapangan','⌕','Selesaikan studi kasus dan proyek.',completed('case')&&completed('project')],
 ['Penakluk Kuis','★','Raih nilai kuis minimal 80.',Number(S.quiz.best)>=80],
 ['Master Keanekaragaman','✦','Tuntaskan seluruh pembelajaran dan kuis ≥80.',S.awarded.includes('course-complete')]
 ];return `<div class="badge-grid">${badges.map(b=>`<div class="achievement ${b[3]?'':'locked'}"><div class="medal" aria-hidden="true">${b[1]}</div><h3>${b[0]}</h3><p>${b[2]}</p><p><b>${b[3]?'TERBUKA':'TERKUNCI'}</b></p></div>`).join('')}</div>`;}
function resultsPage(){const num=CORE_STAGES.filter(completed).length,pct=Math.round(num/CORE_STAGES.length*100),score=S.quiz.score??0,[label,motivation]=S.quiz.finished?verdict(score):['Belum Ada Nilai','Selesaikan kuis untuk melihat hasil.'];return `<article class="card print-area" id="results-print"><div class="eyebrow">Sertifikat progres · BIOlab Quest</div><h2>Hasil Petualangan</h2><p><b>Lembaga:</b> PKBM Al-Khadijah<br><b>Penyusun:</b> FAUZAN NABI S.Pd</p><div class="grid4 two-mobile"><div class="metric"><span class="metric-num">${num}/${CORE_STAGES.length}</span><span class="metric-label">Level selesai</span></div><div class="metric"><span class="metric-num">${S.stars}</span><span class="metric-label">Bintang</span></div><div class="metric"><span class="metric-num">${S.points}</span><span class="metric-label">Poin</span></div><div class="metric"><span class="metric-num">${S.xp}</span><span class="metric-label">XP terkumpul</span></div><div class="metric"><span class="metric-num">${score}%</span><span class="metric-label">Nilai kuis</span></div><div class="metric"><span class="metric-num">${pct}%</span><span class="metric-label">Penyelesaian</span></div><div class="metric"><span class="metric-num">${Math.min(8,S.completed.filter(x=>x.startsWith('materi')).length+1)}</span><span class="metric-label">Level saat ini</span></div><div class="metric"><span class="metric-num" style="font-size:1rem">${label}</span><span class="metric-label">Predikat</span></div></div><div class="milestone-bar" style="margin-top:18px"><span style="width:${pct}%"></span></div><p style="margin:12px 0 25px">${motivation}</p><h3>Lencana pencapaian</h3>${badgeList()}<div class="btns no-print"><button class="btn navy" data-action="print">Cetak Hasil</button><button class="btn secondary" data-action="menu">Kembali ke Menu</button><button class="btn outline" data-action="repeat-learning">Ulangi Pembelajaran</button><button class="btn danger" data-action="reset">Reset Progres</button></div><p class="fine-print" style="margin-top:20px">Data laporan hanya berasal dari penyimpanan lokal perangkat. Laporan ini bukan nilai akademik resmi tanpa verifikasi guru.</p></article>`;}
function toggleFullscreen(){const root=document.documentElement;if(!document.fullscreenElement){if(typeof root.requestFullscreen==='function'){root.requestFullscreen().catch(()=>notify('Layar penuh tidak tersedia. Gunakan menu browser untuk fullscreen.'));}else notify('Browser ini tidak mendukung layar penuh.');}else if(typeof document.exitFullscreen==='function'){document.exitFullscreen().catch(()=>notify('Tidak dapat keluar dari fullscreen.'));}}
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement,b=$('fullscreen-button'),l=$('fullscreen-label');if(b){b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Keluar dari mode layar penuh':'Aktifkan mode layar penuh');}if(l)l.textContent=on?'KELUAR FULLSCREEN':'LAYAR PENUH';});
/* ===== Kejadian, validasi, dan pengendali hadiah ===== */
function awardActivity(id){if(S.activityDone.includes(id))return;S.activityDone.push(id);reward('activity-'+id,10,10,1);if(S.activityDone.length===4){markCompleted('activities');notify('Keempat tantangan selesai! Studi kasus terbuka.');confetti();}save();}
function handleAction(action,el){switch(action){
 case'start':navigate('aper');break;
 case'menu':navigate('menu');break;
 case'guide':navigate('guide');break;
 case'go':navigate(el.dataset.page);break;
 case'prev':stepNav(-1);break;
 case'next':stepNav(1);break;
 case'sound':S.sound=!S.sound;save();render();if(S.sound)playTone(true);notify('Suara '+(S.sound?'aktif':'nonaktif'));break;
 case'reset':resetAll();break;
 case'repeat-learning':navigate('aper');notify('Materi siap dipelajari ulang. Hadiah tidak dihitung dua kali.');break;
 case'print':window.print();break;
 case'fullscreen':toggleFullscreen();break;
 case'reveal-aper':{
 const input=$('aper-prediction');S.aperPrediction=input.value.trim();if(S.aperPrediction.length<15){$('aper-error').textContent='Tulis prediksi minimal 15 karakter dan berikan alasannya.';input.focus();save();break;}
 S.aperRevealed=true;markCompleted('aper');reward('aper-complete',5,5,1);save();render();$('aper-feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;}
 case'module-answer':{
 const i=Number(el.dataset.index),j=Number(el.dataset.option),m=DATA.modules[i];if(!m||S.moduleAnswers[i]!==undefined||!canOpen('materi'+i)||j<0||j>=m.opts.length)return;
 S.moduleAnswers[i]=j;if(j===m.correct){markCompleted('materi'+i);reward('check-materi'+i,10,10,1);if(i===7)confetti();}
 else playTone(false);save();render();break;}
 case'module-retry':{
 const i=Number(el.dataset.index);if(completed('materi'+i))return;delete S.moduleAnswers[i];save();render();break;}
 case'activity-category':{
 if(S.activityDone.includes('akt1'))return;const j=Number(el.dataset.index),a=DATA.activities[0];if(j<0||j>=a.options.length)return;S.activityAnswers.akt1={selected:j,message:a.responses[j]};if(j===a.correct)awardActivity('akt1');else playTone(false);save();render();break;}
 case'check-match':{
 if(S.activityDone.includes('akt2'))return;const values=MATCH_OBJECTS.map((_,j)=>S.activityAnswers.akt2?.values?.[j]||'');let wrong=values.findIndex((v,j)=>v!==MATCH_OBJECTS[j].answer);S.activityAnswers.akt2={values,message:values.includes('')?'Lengkapi keempat pasangan terlebih dahulu.':wrong<0?'Benar! Keempat pasangan sesuai.':'Pasangan '+(wrong+1)+' belum sesuai. Cek ciri kingdom organisme tersebut.'};if(wrong<0)awardActivity('akt2');else playTone(false);save();render();break;}
 case'move-step':{
 if(S.activityDone.includes('akt3'))return;let p=Number(el.dataset.position),to=p+Number(el.dataset.direction);if(p>=0&&to>=0&&p<S.sortOrder.length&&to<S.sortOrder.length){[S.sortOrder[p],S.sortOrder[to]]=[S.sortOrder[to],S.sortOrder[p]];S.activityAnswers.akt3=null;save();render();}break;}
 case'check-sort':{
 if(S.activityDone.includes('akt3'))return;const yes=S.sortOrder.every((v,i)=>v===i);S.activityAnswers.akt3={message:yes?'Tepat! Amati, catat, bandingkan, lalu simpulkan.':'Mulailah dengan pengamatan, bukan dengan memilih kerajaan terlebih dahulu.'};if(yes)awardActivity('akt3');else playTone(false);save();render();break;}
 case'check-truefalse':{
 if(S.activityDone.includes('akt4'))return;const values=TRUE_FALSE.map((_,j)=>S.activityAnswers.akt4?.values?.[j]||'');const firstWrong=values.findIndex((v,j)=>v!==TRUE_FALSE[j].answer);let message=values.includes('')?'Jawab seluruh pernyataan dahulu.':firstWrong<0?'Hebat! Semua penilaian berdasarkan bukti.':'Pernyataan '+(firstWrong+1)+' perlu ditinjau: '+TRUE_FALSE[firstWrong].why;
 S.activityAnswers.akt4={values,message};if(firstWrong<0)awardActivity('akt4');else playTone(false);save();render();break;}
 case'check-case':{
 const text=(S.caseAnalysis||'').trim(),empty=S.caseAnswers.some(v=>!v);if(empty||text.length<20){$('case-error').textContent='Pilih tiga kelompok dan isi analisis minimal 20 karakter.';break;}
 S.caseChecked=true;const yes=CASE_SAMPLES.every((c,i)=>c.answer===S.caseAnswers[i]);if(yes){markCompleted('case');reward('case-complete',20,20,2);}else playTone(false);save();render();break;}
 case'check-project':{
 const project=S.project,rows=project.rows;if(rows.some(r=>!r.color||!r.detail||String(r.evidence).trim().length<5)){$('project-error').textContent='Isi dua klasifikasi dan alasan minimal 5 karakter pada semua objek.';break;}
 if(String(project.analysis).trim().length<20||String(project.conclusion).trim().length<30){$('project-error').textContent='Analisis minimal 20 karakter dan kesimpulan minimal 30 karakter.';break;}
 let firstWrong=rows.findIndex((r,i)=>r.detail!==PROJECT_OBJECTS[i].answer);if(firstWrong>=0){$('project-error').textContent='Periksa lagi klasifikasi berdasarkan ciri pada objek '+PROJECT_OBJECTS[firstWrong].name+'.';playTone(false);break;}
 markCompleted('project');reward('project-complete',20,20,2);save();render();break;}
 case'start-quiz':if(canOpen('quiz'))quizStart();break;
 case'quiz-answer':quizAnswer(Number(el.dataset.index));break;
 case'quiz-next':quizNext();break;
 case'finish-summary':markCompleted('summary');reward('summary-complete',5,5,0);navigate('reflection');break;
 case'finish-reflection':{
 const invalid=S.reflection.findIndex(t=>String(t||'').trim().length<5);if(invalid>=0){$('reflection-error').textContent='Isi kelima refleksi dengan setidaknya 5 karakter pada setiap jawaban.';$('reflect-'+invalid).focus();break;}
 markCompleted('reflection');reward('reflection-complete',10,10,1);maybeAllComplete();save();navigate('results');break;}
 default:break;
}}
/* Input siswa selalu ditampilkan kembali dengan property value/textContent,
   bukan dicampurkan ke innerHTML, untuk mencegah injeksi markup. */
function restoreInputs(){const input=(id,value)=>{let e=$(id);if(e)e.value=value??''};
 input('aper-prediction',S.aperPrediction);input('case-analysis',S.caseAnalysis);
 CASE_SAMPLES.forEach((_,i)=>input('case-'+i,S.caseAnswers?.[i]));
 input('project-analysis',S.project.analysis);input('project-conclusion',S.project.conclusion);
 for(let i=0;i<5;i++){input('reflect-'+i,S.reflection[i]);}
 document.querySelectorAll('[data-reflection]').forEach(e=>e.value=S.reflection[Number(e.dataset.reflection)]||'');
 document.querySelectorAll('[data-match]').forEach(e=>e.value=S.activityAnswers.akt2?.values?.[Number(e.dataset.match)]||'');
 document.querySelectorAll('[data-truefalse]').forEach(e=>e.value=S.activityAnswers.akt4?.values?.[Number(e.dataset.truefalse)]||'');
 document.querySelectorAll('[data-project-color]').forEach(e=>e.value=S.project.rows[Number(e.dataset.projectColor)]?.color||'');
 document.querySelectorAll('[data-project-detail]').forEach(e=>e.value=S.project.rows[Number(e.dataset.projectDetail)]?.detail||'');
 document.querySelectorAll('[data-project-evidence]').forEach(e=>e.value=S.project.rows[Number(e.dataset.projectEvidence)]?.evidence||'');
}
function captureInput(el){ if(el.dataset.save){switch(el.dataset.save){case'aperPrediction':S.aperPrediction=el.value;break;case'caseAnalysis':S.caseAnalysis=el.value;S.caseChecked=false;break;case'projectAnalysis':S.project.analysis=el.value;break;case'projectConclusion':S.project.conclusion=el.value;break;}}
 if(el.dataset.case!==undefined){S.caseAnswers[Number(el.dataset.case)]=el.value;S.caseChecked=false;}
 if(el.dataset.reflection!==undefined)S.reflection[Number(el.dataset.reflection)]=el.value;
 if(el.dataset.match!==undefined){let obj=S.activityAnswers.akt2||{values:['','','','']};obj.values[Number(el.dataset.match)]=el.value;obj.message='';S.activityAnswers.akt2=obj;}
 if(el.dataset.truefalse!==undefined){let obj=S.activityAnswers.akt4||{values:['','','','']};obj.values[Number(el.dataset.truefalse)]=el.value;obj.message='';S.activityAnswers.akt4=obj;}
 if(el.dataset.projectColor!==undefined)S.project.rows[Number(el.dataset.projectColor)].color=el.value;
 if(el.dataset.projectDetail!==undefined)S.project.rows[Number(el.dataset.projectDetail)].detail=el.value;
 if(el.dataset.projectEvidence!==undefined)S.project.rows[Number(el.dataset.projectEvidence)].evidence=el.value;
 save();}
/* Semua klik memakai delegation agar event tetap bekerja setelah ganti halaman. */
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-action]');if(!trigger||trigger.disabled)return;handleAction(trigger.dataset.action,trigger);});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('input,textarea,select'))captureInput(t);});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input,textarea,select'))captureInput(t);});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const target=e.target;if(target.closest('input,textarea,select,button,summary,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'){e.preventDefault();stepNav(-1)}else if(e.key==='ArrowRight'){e.preventDefault();stepNav(1)}});
// Muat ulang halaman terakhir bila masih terbuka menurut progres yang disimpan.
render();

</script></body>
